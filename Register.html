<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - PeerSkill</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar">

        <div class="logo">
            PeerSkill
        </div>

        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="login.html">
                Login
            </a>

        </div>

    </nav>


    <!-- Registration Section -->
    <section class="form-section">

        <div class="form-container">

            <h1>Create Your Account</h1>

            <p>
                Join your college peer learning community.
            </p>


            <form id="registerForm">

                <!-- Full Name -->
                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    required
                >


                <!-- College Email -->
                <label for="email">
                    College Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your college email"
                    required
                >


                <!-- Password -->
                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create password"
                    required
                >


                <!-- Department -->
                <label for="department">
                    Department
                </label>

                <input
                    type="text"
                    id="department"
                    placeholder="Example: AI & DS"
                    required
                >


                <!-- Year -->
                <label for="year">
                    Year
                </label>

                <select id="year" required>

                    <option value="">
                        Select Year
                    </option>

                    <option value="1">
                        1st Year
                    </option>

                    <option value="2">
                        2nd Year
                    </option>

                    <option value="3">
                        3rd Year
                    </option>

                    <option value="4">
                        4th Year
                    </option>

                </select>


                <!-- Skills You Can Teach -->
                <label for="teachSkills">
                    Skills You Can Teach
                </label>

                <input
                    type="text"
                    id="teachSkills"
                    placeholder="Python, Java, SQL"
                    required
                >


                <!-- Skills You Want To Learn -->
                <label for="learnSkills">
                    Skills You Want To Learn
                </label>

                <input
                    type="text"
                    id="learnSkills"
                    placeholder="React, JavaScript, ML"
                    required
                >


                <!-- Submit Button -->
                <button type="submit">
                    Create Account
                </button>

            </form>


            <!-- Login Link -->
            <p class="form-bottom">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </section>


    <!-- JavaScript -->
    <script src="Register.js"></script>

</body>

</html>
