<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - PeerSkill</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar">

        <div class="logo">
            PeerSkill
        </div>

        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="Register.html">
                Register
            </a>

        </div>

    </nav>


    <!-- Login Section -->
    <section class="form-section">

        <div class="form-container">

            <h1>Welcome Back</h1>

            <p>
                Login to continue learning and sharing.
            </p>


            <form id="loginForm">

                <!-- College Email -->
                <label for="loginEmail">
                    College Email
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    required
                >


                <!-- Password -->
                <label for="loginPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    required
                >


                <!-- Login Button -->
                <button type="submit">
                    Login
                </button>

            </form>


            <!-- Register Link -->
            <p class="form-bottom">

                Don't have an account?

                <a href="Register.html">
                    Register
                </a>

            </p>

        </div>

    </section>


    <!-- JavaScript -->
    <script src="login.js"></script>

</body>

</html>
