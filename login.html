<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - PeerSkill</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>

    <nav class="navbar">

        <div class="logo">
            PeerSkill
        </div>

        <div class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="register.html">
                Register
            </a>

        </div>

    </nav>


    <section class="form-section">

        <div class="form-container">

            <h1>Welcome Back</h1>

            <p>
                Login to continue learning and sharing.
            </p>


            <form id="loginForm">

                <label>
                    College Email
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    required
                >


                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    required
                >


                <button type="submit">
                    Login
                </button>

            </form>


            <p class="form-bottom">

                Don't have an account?

                <a href="register.html">
                    Register
                </a>

            </p>

        </div>

    </section>
    <script src="js/login.js"></script>

</body>

</html>
